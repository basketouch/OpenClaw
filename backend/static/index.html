<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Alex — OpenClaw</title>
  <link rel="stylesheet" href="/style.css?v=29">
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" href="/icon.png" type="image/png">
  <link rel="apple-touch-icon" href="/icon.png">
  <meta name="theme-color" content="#111113">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Alex">
</head>
<body>

<!-- Auth -->
<div id="auth-screen">
  <div class="auth-card">
    <div class="brand">
      <span class="brand-icon">⚡</span>
      <span class="brand-name">OpenClaw</span>
    </div>
    <h1 class="alex-name">Alex</h1>
    <p class="alex-sub">Asistente Operativo</p>
    <input id="username-input" type="text" placeholder="Usuario" autocomplete="username">
    <input id="password-input" type="password" placeholder="Contraseña" autocomplete="current-password">
    <button id="login-btn" onclick="login()">Entrar</button>
    <p id="auth-error" class="auth-err"></p>
  </div>
</div>

<!-- App -->
<div id="app" class="hidden">
  <div class="app-layout">

    <!-- Sidebar overlay (mobile) -->
    <div id="sidebar-overlay" class="sidebar-overlay" onclick="closeSidebar()"></div>

    <!-- Sidebar -->
    <aside id="sidebar" class="sidebar">
      <div class="sidebar-hdr">
        <span class="sidebar-title">Espacios</span>
        <button class="btn-icon" onclick="openNewChatPicker()" title="Nueva conversación">⊕</button>
      </div>
      <div id="new-chat-picker" class="new-chat-picker hidden"></div>
      <div id="chat-list" class="chat-list">
        <p class="no-chats">Cargando…</p>
      </div>
    </aside>

    <!-- Main area -->
    <div class="main-area">
      <header>
        <div class="hdr-left">
          <button class="btn-icon sidebar-toggle" onclick="toggleSidebar()" title="Conversaciones">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
          </button>
          <span class="hdr-icon">⚡</span>
          <div>
            <div id="app-title" class="hdr-title">Alex - Nueva conversación</div>
            <span class="hdr-sub" id="chat-title-hdr">General</span>
          </div>
        </div>
        <div class="hdr-right">
          <span id="status-dot" class="dot"></span>
          <button class="btn-icon" onclick="openAdmin()" title="Administración">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg>
          </button>
          <button class="btn-icon" onclick="logout()" title="Cerrar sesión">↩</button>
        </div>
      </header>

      <main id="chat">
        <div id="messages"></div>
      </main>

      <footer>
        <div id="attach-preview" class="attach-preview hidden"></div>
        <div id="voice-status" class="voice-status hidden" aria-live="polite"></div>
        <div class="input-wrap">
          <button id="attach-btn" onclick="pickFile()" title="Adjuntar archivo">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21.44 11.05l-9.19 9.19a6 6 0 01-8.49-8.49l9.19-9.19a4 4 0 015.66 5.66l-9.2 9.19a2 2 0 01-2.83-2.83l8.49-8.48"/>
            </svg>
          </button>
          <button id="voice-btn" title="Toca para dictar · Mantén para hablar con Alex" aria-label="Toca para dictar. Mantén pulsado para hablar con Alex.">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10a7 7 0 0014 0M12 17v5M8 22h8"/></svg>
          </button>
          <textarea
            id="msg-input"
            placeholder="Escribe un mensaje…"
            rows="1"
            onkeydown="onKey(event)"
            oninput="resize(this)"
          ></textarea>
          <button id="send-btn" onclick="sendMessage()">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <line x1="22" y1="2" x2="11" y2="13"></line>
              <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
            </svg>
          </button>
        </div>
      </footer>
    </div><!-- main-area -->
  </div><!-- app-layout -->
</div><!-- app -->

<!-- Admin panel -->
<div id="admin-overlay" class="admin-overlay hidden" onclick="closeAdmin()"></div>
<div id="admin-panel" class="admin-panel hidden">
  <div class="admin-hdr">
    <span>Administración</span>
    <button class="btn-icon" onclick="closeAdmin()">✕</button>
  </div>
  <div class="admin-body">
    <div class="admin-section">
      <div class="admin-section-title" onclick="toggleSection(this)">Sistema</div>
      <div class="stat-grid">
        <div class="stat-item"><span class="stat-label">Disco</span><span id="s-disk" class="stat-val">…</span></div>
        <div class="stat-item"><span class="stat-label">RAM</span><span id="s-mem" class="stat-val">…</span></div>
        <div class="stat-item"><span class="stat-label">Carga</span><span id="s-load" class="stat-val">…</span></div>
        <div class="stat-item"><span class="stat-label">Uptime</span><span id="s-uptime" class="stat-val">…</span></div>
      </div>
    </div>
    <div class="admin-section">
      <div class="admin-section-title" onclick="toggleSection(this)">Contenedores</div>
      <div id="admin-containers">…</div>
    </div>
    <div class="admin-section">
      <div class="admin-section-title" onclick="toggleSection(this)">Recordatorios por Telegram</div>
      <form id="task-form" class="task-form" onsubmit="saveTask(event)">
        <input id="task-name" maxlength="100" placeholder="Título del recordatorio" required>
        <textarea id="task-prompt" rows="3" maxlength="1200" placeholder="Mensaje o instrucción para Alex" required></textarea>
        <select id="task-frequency" onchange="renderTaskScheduleFields()">
          <option value="date">Una vez</option>
          <option value="daily">Cada día</option>
          <option value="weekly">Cada semana</option>
          <option value="interval">Cada cierto tiempo</option>
        </select>
        <div id="task-schedule-fields" class="task-schedule-fields"></div>
        <div class="task-form-actions">
          <button id="task-save-btn" class="admin-btn task-save-btn" type="submit">Crear recordatorio</button>
          <button id="task-cancel-btn" class="task-btn hidden" type="button" onclick="cancelTaskEdit()">Cancelar</button>
        </div>
        <p id="task-form-status" class="task-form-status" aria-live="polite"></p>
      </form>
      <div id="admin-tasks">…</div>
    </div>
    <div class="admin-section">
      <div class="admin-section-title" onclick="toggleSection(this)">Telegram</div>
      <div id="tg-status" style="font-size:13px;margin-bottom:10px;color:var(--muted)">…</div>
      <button class="admin-btn" onclick="detectTelegramChat()">Detectar Chat ID</button>
      <div id="tg-test-wrap" style="display:none;margin-top:8px">
        <button class="admin-btn" onclick="testTelegram()">Enviar mensaje de prueba</button>
      </div>
    </div>

    <div class="admin-section">
      <div class="admin-section-title" onclick="toggleSection(this)">Notificaciones Push</div>
      <div id="push-status" style="font-size:13px;margin-bottom:10px;color:var(--muted)">…</div>
      <button class="admin-btn" id="push-btn" onclick="togglePush()">Activar notificaciones</button>
      <div id="push-test-wrap" style="display:none;margin-top:8px">
        <button class="admin-btn" onclick="testPush()">Enviar notificación de prueba</button>
      </div>
    </div>

  </div>
</div>

  <script src="/app.js?v=38"></script>
<script src="/mode.js?v=1"></script>
</body>
</html>
