services:
  openclaw:
    build: ./backend
    container_name: openclaw
    restart: unless-stopped
    privileged: true
    pid: "host"
    env_file: .env
    environment:
      - WORKSPACE_PATH=/workspace
    volumes:
      - openclaw_workspace:/workspace
      - openclaw_data:/data
      - /root/openclaw-app:/root/openclaw-app
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - default
      - n8n-infra

networks:
  n8n-infra:
    external: true
    name: n8n-infra_default

volumes:
  openclaw_workspace:
  openclaw_data:
